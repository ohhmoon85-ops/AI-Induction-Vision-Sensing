
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-Induction: The Eye of Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@100;400;700;900&display=swap');
        
        :root {
            --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.08); 
        }

        .glass-dark {
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .shadow-glow-emerald { box-shadow: var(--emerald-glow); }
        .shadow-4xl { box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.5); }

        .eye-pulse {
            animation: eye-blink 3.5s infinite;
        }

        @keyframes eye-blink {
            0%, 90%, 100% { transform: scaleY(1); opacity: 1; }
            95% { transform: scaleY(0.1); opacity: 0.5; }
        }

        .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .animate-in {
            animation-duration: 0.3s;
            animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            animation-fill-mode: both;
        }

        .fade-in { animation-name: fade-in; }
        .zoom-in-95 { animation-name: zoom-in-95; }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in-95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
