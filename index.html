
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI-Induction: The Eye of Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@100;400;700;900&display=swap');
        
        :root {
            --emerald-glow: 0 0 20px rgba(16, 185, 129, 0.4);
            --blue-glow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .glass { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .shadow-glow-emerald { box-shadow: var(--emerald-glow); }
        .shadow-glow-blue { box-shadow: var(--blue-glow); }

        .eye-pulse {
            animation: eye-blink 3s infinite;
        }

        @keyframes eye-blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .boil-animation {
            animation: boil-water 0.4s infinite alternate ease-in-out;
        }

        @keyframes boil-water {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-4px) scale(1.02); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.6.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
